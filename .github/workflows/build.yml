name: build

on: [push, pull_request]

jobs:
  build-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build PIDFinder.sln -c Release
      - run: dotnet test PIDFinder.Tests/PIDFinder.Tests.csproj -c Release --no-build
